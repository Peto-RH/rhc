name: Prepare upstream release
run-name: Prepare rhc-v${{ inputs.release_version }} by @${{ github.actor }}

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: "New version (X.Y.Z)"
        required: true
        type: string
      base_branch:
        description: "Branch to release"
        required: true
        default: "main"
        type: string
      jira_issue:
        description: "Release Jira card (CCT-1234 or RHEL-1234)"
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout workflow helpers
        uses: actions/checkout@v7
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false

      - name: Checkout release branch
        uses: actions/checkout@v7
        with:
          ref: refs/heads/${{ inputs.base_branch }}
          path: source
          persist-credentials: false

      - name: Open version bump PR
        working-directory: source
        env:
          RELEASE_VERSION: ${{ inputs.release_version }}
          BASE_BRANCH: ${{ inputs.base_branch }}
          JIRA_ISSUE: ${{ inputs.jira_issue }}
          GH_TOKEN: ${{ github.token }}
        run: python3 ../.github/workflows/prepare-release/prepare-release.py
